# Step 2 of 2 — install this only AFTER Certbot has issued the certificate.
# The ssl_certificate paths below do not exist until then, and Nginx will not
# start without them. Use sunenterprise.lk.http.conf first.

server {
    listen 80;
    listen [::]:80;
    server_name sunenterprise.lk www.sunenterprise.lk;
    return 301 https://sunenterprise.lk$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sunenterprise.lk www.sunenterprise.lk;

    root /var/www/sunenterprise/public;
    index index.php;

    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/sunenterprise.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunenterprise.lk/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
