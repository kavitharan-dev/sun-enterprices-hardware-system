# Step 1 of 2 — use this config ONLY until the SSL certificate exists.
#
# The full config (sunenterprise.lk.conf) points at certificate files that
# Certbot has not created yet, so Nginx refuses to start with it. Install this
# HTTP-only config first, run Certbot, then switch to the full config.
#
#   sudo cp deploy/nginx/sunenterprise.lk.http.conf \
#           /etc/nginx/sites-available/sunenterprise.lk
#   sudo ln -s /etc/nginx/sites-available/sunenterprise.lk \
#              /etc/nginx/sites-enabled/sunenterprise.lk
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sunenterprise.lk -d www.sunenterprise.lk

server {
    listen 80;
    listen [::]:80;
    server_name sunenterprise.lk www.sunenterprise.lk;

    root /var/www/sunenterprise/public;
    index index.php;

    charset utf-8;

    # Certbot writes its proof-of-ownership file here, so this path must stay
    # reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sunenterprise/public;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
